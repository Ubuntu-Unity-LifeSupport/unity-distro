# UNITY-20260927-012 test drop-in for the unity-settings-daemon user unit
# (removed after the test): fill freed memory with 0xa5 and keep freed
# chunks out of tcache, so that a use of freed memory crashes at once
# instead of reading whatever the chunk still holds; and log g_debug, so the
# journal shows how the daemon leaves ("Got Stop signal", "Received SIGTERM").
[Service]
Environment=GLIBC_TUNABLES=glibc.malloc.perturb=165:glibc.malloc.tcache_count=0
Environment=G_MESSAGES_DEBUG=all
